name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt

      - name: Install
        run: python -m pip install -e ".[dev]" -c constraints.txt

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Agent skills are in sync
        run: python scripts/sync_agent_skills.py --check

      - name: No secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

      # Add a repository secret named BLOCKED_TERMS to turn this check on.
      - name: No blocked terms
        run: python scripts/check_blocked_terms.py --all --mask
        env:
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}

      # The tests use the built-in mock LLM. They need no key and no network.
      - name: Tests
        run: python -m pytest
